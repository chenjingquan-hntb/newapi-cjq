name: Sync upstream new-api

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    name: Sync QuantumNous/new-api main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: upstream-sync

      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/QuantumNous/new-api.git main

      - name: Update upstream-sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B upstream-sync FETCH_HEAD
          git push origin upstream-sync --force-with-lease
